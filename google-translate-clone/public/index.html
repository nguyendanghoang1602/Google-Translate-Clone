<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Dịch - Clone</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material-Symbols-Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="icon-btn menu-btn" id="menuToggleBtn" title="Menu chính">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="logo">
                <span class="logo-google"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span></span>
                <span class="logo-sub">Dịch</span>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="openHistoryBtn" title="Xem lịch sử dịch">
                <span class="material-symbols-outlined">history</span>
            </button>
            <button class="icon-btn" id="openSavedBtn" title="Từ đã lưu (đánh dấu sao)">
                <span class="material-symbols-outlined">star</span>
            </button>
            <div class="user-avatar" title="Tài khoản Google">H</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Tab Bar (Văn bản / Tài liệu) -->
        <div class="feature-tabs">
            <button class="tab-btn active" id="tabTextBtn">
                <span class="material-symbols-outlined">translate</span>
                <span>Văn bản</span>
            </button>
            <button class="tab-btn" id="tabDocBtn">
                <span class="material-symbols-outlined">description</span>
                <span>Tài liệu</span>
            </button>
            <input type="file" id="fileInput" accept=".txt" style="display: none;">
        </div>

        <!-- Translation Card Box -->
        <div class="translate-box">
            <!-- Top Language Controls -->
            <div class="lang-selector-bar">
                <div class="source-lang-group">
                    <button class="lang-tab-btn active" data-lang="auto">Phát hiện ngôn ngữ</button>
                    <button class="lang-tab-btn" data-lang="en">Tiếng Anh</button>
                    <button class="lang-tab-btn" data-lang="vi">Tiếng Việt</button>
                    <select id="sourceLangSelect" class="lang-dropdown">
                        <option value="auto">Phát hiện ngôn ngữ</option>
                        <option value="en" selected>Tiếng Anh</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="fr">Tiếng Pháp</option>
                        <option value="ja">Tiếng Nhật</option>
                        <option value="ko">Tiếng Hàn</option>
                        <option value="zh">Tiếng Trung</option>
                        <option value="es">Tiếng Tây Ban Nha</option>
                        <option value="de">Tiếng Đức</option>
                        <option value="ru">Tiếng Nga</option>
                    </select>
                </div>

                <button class="icon-btn swap-btn" id="swapLangBtn" title="Hoán đổi ngôn ngữ">
                    <span class="material-symbols-outlined">swap_horiz</span>
                </button>

                <div class="target-lang-group">
                    <button class="lang-tab-btn active" data-lang="vi">Tiếng Việt</button>
                    <button class="lang-tab-btn" data-lang="en">Tiếng Anh</button>
                    <select id="targetLangSelect" class="lang-dropdown">
                        <option value="vi" selected>Tiếng Việt</option>
                        <option value="en">Tiếng Anh</option>
                        <option value="fr">Tiếng Pháp</option>
                        <option value="ja">Tiếng Nhật</option>
                        <option value="ko">Tiếng Hàn</option>
                        <option value="zh">Tiếng Trung</option>
                        <option value="es">Tiếng Tây Ban Nha</option>
                        <option value="de">Tiếng Đức</option>
                        <option value="ru">Tiếng Nga</option>
                    </select>
                </div>
            </div>

            <!-- Text Panes Grid -->
            <div class="panes-wrapper">
                <!-- Source Pane -->
                <div class="pane source-pane">
                    <div class="textarea-container">
                        <textarea id="sourceText" placeholder="Nhập văn bản..." spellcheck="false"></textarea>
                        <button class="clear-btn" id="clearBtn" title="Xóa văn bản" style="display: none;">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>

                    <div class="pane-footer">
                        <div class="footer-left">
                            <button class="icon-btn" id="speechInputBtn" title="Dịch bằng giọng nói (Microphone)">
                                <span class="material-symbols-outlined">mic</span>
                            </button>
                            <button class="icon-btn" id="listenSourceBtn" title="Nghe văn bản gốc">
                                <span class="material-symbols-outlined">volume_up</span>
                            </button>
                        </div>
                        <div class="footer-right">
                            <span class="char-count" id="charCount">0 / 5,000</span>
                        </div>
                    </div>
                </div>

                <!-- Target Pane -->
                <div class="pane target-pane">
                    <div class="textarea-container">
                        <div class="loading-spinner" id="loadingSpinner" style="display: none;">
                            <div class="spinner"></div>
                        </div>
                        <div id="targetText" class="target-display">Bản dịch sẽ hiển thị ở đây...</div>
                    </div>

                    <div class="pane-footer">
                        <div class="footer-left">
                            <button class="icon-btn" id="listenTargetBtn" title="Nghe bản dịch">
                                <span class="material-symbols-outlined">volume_up</span>
                            </button>
                            <button class="icon-btn" id="copyBtn" title="Sao chép bản dịch">
                                <span class="material-symbols-outlined">content_copy</span>
                            </button>
                            <button class="icon-btn" id="starCurrentBtn" title="Lưu bản dịch">
                                <span class="material-symbols-outlined">star_border</span>
                            </button>
                        </div>
                        <div class="footer-right">
                            <button class="translate-action-btn" id="manualTranslateBtn">Dịch</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Side Drawer: Lịch sử & Từ yêu thích -->
    <aside class="sidebar-drawer" id="sidebarDrawer">
        <div class="drawer-header">
            <h3 id="drawerTitle">Lịch sử dịch</h3>
            <button class="icon-btn" id="closeDrawerBtn">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="drawer-controls">
            <button class="filter-tab-btn active" id="filterAllBtn">Tất cả</button>
            <button class="filter-tab-btn" id="filterStarredBtn">Đã đánh dấu sao</button>
            <button class="clear-history-link" id="clearAllHistoryBtn">Xóa tất cả</button>
        </div>
        <div class="drawer-content" id="historyList">
            <!-- Các item lịch sử sẽ được render bằng JS ở đây -->
        </div>
    </aside>
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMessage">Đã sao chép vào khay nhớ tạm!</div>

    <script src="app.js"></script>
</body>
</html>
